
name: HmsApi - CI/CD

on:
  push:
    branches:
      - Uat
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hmsapi-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore HealthCareAPI.slnx

      - name: Build solution
        run: dotnet build HealthCareAPI.slnx --configuration Release --no-restore

      - name: Publish Web API
        run: >
          dotnet publish HealthCareAPI/HealthCareAPI.csproj
          --configuration Release
          --runtime win-x86
          --self-contained false
          --output ./publish

      - name: Deploy to MonsterASP.NET
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
